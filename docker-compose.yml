name: restick

include:
  - path: deploy/postgres/docker-compose.yml
  - path: deploy/minio/docker-compose.yml
  - path: services/api/docker-compose.yml
  - path: services/ftp/docker-compose.yml
  - path: services/img_tool/docker-compose.yml
  - path: services/gateway/docker-compose.yml
  - path: clients/web/docker-compose.yml

services:
  api_svc:
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FTP_SVC_GRPC_ADDR: ftp_svc:50052
      IMG_TOOL_GRPC_ADDR: img_tool:50053
  ftp_svc:
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      API_SVC_GRPC_ADDR: api_svc:50051
      IMG_TOOL_GRPC_ADDR: img_tool:50053
      MINIO_ENDPOINT: minio:9000
  img_tool:
    depends_on:
      api_svc:
        condition: service_healthy
      ftp_svc:
        condition: service_healthy
    environment:
      API_SVC_GRPC_ADDR: api_svc:50051
      FTP_SVC_GRPC_ADDR: ftp_svc:50052
  web:
    depends_on:
      api_svc:
        condition: service_healthy
      ftp_svc:
        condition: service_healthy
