services:
  img_tool:
    build:
      context: ../..
      dockerfile: services/img_tool/Dockerfile
    environment:
      SERVICE_NAME: img_tool
      HTTP_ADDR: ":8080"
      GRPC_ADDR: ":50053"
      API_SVC_GRPC_ADDR: ${API_SVC_GRPC_ADDR:-api_svc:50051}
      FTP_SVC_GRPC_ADDR: ${FTP_SVC_GRPC_ADDR:-ftp_svc:50052}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-internal-token}
      IMG_TOOL_ENGINE: ${IMG_TOOL_ENGINE:-simple}
      FTP_HTTP_URL: ${FTP_HTTP_URL:-http://ftp_svc:8080}
    networks:
      - restick

networks:
  restick:
    name: restick
