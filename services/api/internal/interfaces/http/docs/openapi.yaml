openapi: 3.0.3
info:
  title: Restick API
  version: 1.0.0
  description: |
    HTTP API for Restick (auth, packs, moderation, SDK catalog).

    **Auth**
    - Bearer JWT from `/api/v1/auth/login` or `/api/v1/auth/register` (Authorize → Bearer).
    - `X-Api-Key` for SDK catalog endpoints (list published packs, HEAD, bundle, tombstones).
  contact:
    name: Restick
servers:
  - url: /
    description: This api_svc instance
tags:
  - name: Health
  - name: Auth
  - name: Catalog
  - name: Packs
  - name: Admin
  - name: API Keys
security: []
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        display_name:
          type: string
        role:
          type: string
          enum: [contributor, admin]
    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
        expires_in:
          type: integer
        user:
          $ref: "#/components/schemas/User"
    PackSummary:
      type: object
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        author: { type: string }
        tags:
          type: array
          items: { type: string }
        sticker_count: { type: integer }
        version: { type: integer }
        status: { type: string }
        thumbnail_url: { type: string }
        checksum_sha256: { type: string }
    Sticker:
      type: object
      properties:
        file: { type: string }
        emoji_hint: { type: string }
        keywords:
          type: array
          items: { type: string }
        width: { type: integer }
        height: { type: integer }
        file_url: { type: string }
        thumb_url: { type: string }
    PackDetail:
      allOf:
        - $ref: "#/components/schemas/PackSummary"
        - type: object
          properties:
            stickers:
              type: array
              items:
                $ref: "#/components/schemas/Sticker"
            reject_reason: { type: string }
            upload_prefix: { type: string }
    ReasonBody:
      type: object
      required: [reason_text]
      properties:
        reason_code: { type: string }
        rejection_code: { type: string }
        revocation_code: { type: string }
        reason_text: { type: string }
    RejectionStat:
      type: object
      properties:
        reason_code: { type: string }
        rejection_count: { type: integer }
    APIKey:
      type: object
      properties:
        id: { type: string }
        user_id: { type: string, nullable: true }
        user_email: { type: string }
        name: { type: string }
        key_prefix: { type: string }
        is_active: { type: boolean }
        expires_at: { type: string, format: date-time, nullable: true }
        last_used_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    CreatedAPIKey:
      allOf:
        - $ref: "#/components/schemas/APIKey"
        - type: object
          properties:
            raw_key: { type: string, description: "Raw plaintext API key returned only once upon creation or rotation" }
    CreateAPIKeyRequest:
      type: object
      properties:
        name: { type: string, example: "SDK Production Key" }
        expires_in_days: { type: integer, example: 90, nullable: true }
    RotateAPIKeyRequest:
      type: object
      properties:
        expires_in_days: { type: integer, example: 90, nullable: true }
paths:
  /healthz:
    get:
      tags: [Health]
      summary: Liveness
      operationId: healthz
      responses:
        "200":
          description: OK
  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Register contributor
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string, minLength: 8 }
                display_name: { type: string }
      responses:
        "200":
          description: Token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400": { description: Invalid input }
        "409": { description: Email taken }
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Sign in
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401": { description: Invalid credentials }
  /api/v1/me:
    get:
      tags: [Auth]
      summary: Current user
      operationId: me
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401": { description: Unauthorized }
  /api/v1/packs:
    get:
      tags: [Catalog]
      summary: List published packs (SDK)
      operationId: listPublished
      security: [{ ApiKeyAuth: [] }]
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: page_size
          schema: { type: integer, default: 20, maximum: 50 }
        - in: query
          name: tag
          schema: { type: string }
      responses:
        "200":
          description: Page of published packs
        "401": { description: API key required }
    post:
      tags: [Packs]
      summary: Create draft pack
      operationId: createPack
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug]
              properties:
                name: { type: string }
                slug: { type: string }
                author: { type: string }
                tags:
                  type: array
                  items: { type: string }
                source_kind:
                  type: string
                  enum: [sheet, files]
      responses:
        "200":
          description: Draft created
        "400": { description: Invalid name or slug }
        "409": { description: Slug taken }
  /api/v1/packs/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    get:
      tags: [Catalog, Packs]
      summary: Pack detail
      description: Owner or admin with Bearer, or published pack with X-Api-Key.
      operationId: getPack
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        "200":
          description: Detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackDetail"
        "401": { description: Unauthorized }
        "404": { description: Not found }
        "410": { description: Revoked }
    head:
      tags: [Catalog]
      summary: Published pack existence / ETag
      operationId: headPack
      security: [{ ApiKeyAuth: [] }]
      responses:
        "200": { description: Exists }
        "401": { description: API key required }
        "404": { description: Not found }
        "410": { description: Revoked }
    put:
      tags: [Packs]
      summary: Update pack name, slug, tags
      operationId: updatePack
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                slug: { type: string }
                tags:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: Updated
        "400": { description: Bad request }
        "403": { description: Cannot edit }
        "409": { description: Slug conflict }
    delete:
      tags: [Packs]
      summary: Hard-delete rejected pack (owner)
      operationId: deleteRejectedPack
      security: [{ BearerAuth: [] }]
      responses:
        "200": { description: Deleted }
        "403": { description: Forbidden }
        "409": { description: Not rejected }
  /api/v1/packs/{id}/bundle:
    get:
      tags: [Catalog]
      summary: Bundle download metadata
      operationId: bundleMeta
      security: [{ ApiKeyAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Bundle URL and checksum }
        "410": { description: Revoked }
  /api/v1/packs/{id}/stickers:
    put:
      tags: [Packs]
      summary: Update sticker emoji/keywords
      operationId: updateStickersMetadata
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                stickers:
                  type: array
                  items:
                    type: object
                    properties:
                      file: { type: string }
                      filename: { type: string }
                      emoji_hint: { type: string }
                      keywords:
                        type: array
                        items: { type: string }
      responses:
        "200": { description: Updated detail }
        "403": { description: Cannot edit }
  /api/v1/packs/{id}/submit:
    post:
      tags: [Packs]
      summary: Submit draft/rejected pack for processing
      operationId: submitPack
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Processing }
        "409": { description: Cannot submit }
  /api/v1/packs/{id}/confirm:
    post:
      tags: [Packs]
      summary: Admin self-confirm publish
      operationId: confirmPack
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Published }
        "403": { description: Forbidden }
  /api/v1/packs/{id}/revoke:
    post:
      tags: [Packs]
      summary: Owner withdraw published pack
      operationId: ownerRevokePack
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Revoked with tombstone }
        "403": { description: Forbidden }
        "409": { description: Not published }
  /api/v1/me/packs:
    get:
      tags: [Packs]
      summary: My packs
      operationId: listMine
      security: [{ BearerAuth: [] }]
      responses:
        "200": { description: Items }
  /api/v1/tombstones:
    get:
      tags: [Catalog]
      summary: Revocation tombstones (SDK purge)
      operationId: tombstones
      security: [{ ApiKeyAuth: [] }]
      parameters:
        - in: query
          name: since
          schema: { type: string, format: date-time }
      responses:
        "200": { description: Tombstone list }
  /api/v1/admin/packs:
    get:
      tags: [Admin]
      summary: Review queue
      operationId: adminQueue
      security: [{ BearerAuth: [] }]
      responses:
        "200": { description: Pending packs }
        "403": { description: Admin only }
  /api/v1/admin/packs/{id}:
    get:
      tags: [Admin]
      summary: Admin pack detail
      operationId: adminGet
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Detail }
        "403": { description: Admin only }
  /api/v1/admin/packs/{id}/approve:
    post:
      tags: [Admin]
      summary: Approve pack
      operationId: approvePack
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Published }
        "403": { description: Forbidden }
  /api/v1/admin/packs/{id}/reject:
    post:
      tags: [Admin]
      summary: Reject pack
      operationId: rejectPack
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonBody"
      responses:
        "200": { description: Rejected }
        "400": { description: reason_text required }
  /api/v1/admin/packs/{id}/revoke:
    post:
      tags: [Admin]
      summary: Revoke published pack
      operationId: adminRevoke
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonBody"
      responses:
        "200": { description: Revoked }
  /api/v1/admin/published:
    get:
      tags: [Admin]
      summary: All published packs
      operationId: adminPublished
      security: [{ BearerAuth: [] }]
      responses:
        "200": { description: Catalog }
  /api/v1/admin/analytics/rejections:
    get:
      tags: [Admin]
      summary: Rejection analytics
      operationId: rejectionAnalytics
      security: [{ BearerAuth: [] }]
      responses:
        "200": { description: Stats }
  /api/v1/me/api-keys:
    get:
      tags: [API Keys]
      summary: List personal API keys
      operationId: listMyAPIKeys
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: List of API keys
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/APIKey"
    post:
      tags: [API Keys]
      summary: Create new personal API key
      operationId: createMyAPIKey
      security: [{ BearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAPIKeyRequest"
      responses:
        "201":
          description: Created API key with raw token (shown once)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedAPIKey"
  /api/v1/me/api-keys/{id}/rotate:
    post:
      tags: [API Keys]
      summary: Rotate personal API key
      operationId: rotateMyAPIKey
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RotateAPIKeyRequest"
      responses:
        "200":
          description: Rotated API key with new raw token (shown once)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedAPIKey"
        "404": { description: Key not found }
  /api/v1/me/api-keys/{id}:
    delete:
      tags: [API Keys]
      summary: Revoke and delete personal API key
      operationId: deleteMyAPIKey
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Key deleted }
        "404": { description: Key not found }
  /api/v1/admin/api-keys:
    get:
      tags: [Admin, API Keys]
      summary: List all system API keys (Admin)
      operationId: adminListAPIKeys
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: All system API keys
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/APIKey"
  /api/v1/admin/api-keys/{id}:
    delete:
      tags: [Admin, API Keys]
      summary: Admin delete API key
      operationId: adminDeleteAPIKey
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Key deleted }
        "404": { description: Key not found }

