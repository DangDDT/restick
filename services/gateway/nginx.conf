user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression for text, json, js, css, wasm
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml application/wasm;

    # Maximum payload size for sticker sheet uploads and zip bundles
    client_max_body_size 50M;

    # Preserve X-Forwarded-Proto set by an upstream TLS terminator (Cloudflare, ALB, host Nginx).
    # Falls back to $scheme for direct connections.
    map $http_x_forwarded_proto $real_proto {
        default $scheme;
        "http"  http;
        "https" https;
    }
    # Docker service IPs change when containers restart. Resolve upstream names
    # continuously instead of pinning their startup-time addresses.
    resolver 127.0.0.11 valid=10s ipv6=off;


    upstream api_backend {
        zone api_backend 64k;
        server api_svc:8080 resolve;
        keepalive 32;
    }

    upstream ftp_backend {
        zone ftp_backend 64k;
        server ftp_svc:8080 resolve;
        keepalive 32;
    }

    upstream web_backend {
        zone web_backend 64k;
        server web:8080 resolve;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # 1. Gateway Healthcheck
        location = /healthz {
            default_type application/json;
            return 200 '{"status":"ok","service":"gateway"}\n';
        }

        # 2. API Services (REST endpoints)
        location /api/ {
            proxy_pass http://api_backend/api/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $real_proto;
            proxy_set_header X-Forwarded-Host $http_host;

            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # 3. Interactive Swagger & OpenAPI Documentation
        location /docs {
            proxy_pass http://api_backend/docs;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $real_proto;
        }

        location = /openapi.yaml {
            proxy_pass http://api_backend/openapi.yaml;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $real_proto;
        }

        # 4. CDN & Asset Delivery (ftp_svc)
        # Optimized for high-throughput streaming of WebP stickers and ZIP bundle archives
        location ~ ^/(v1/objects|v1/bundles)/ {
            proxy_pass http://ftp_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $real_proto;
            proxy_set_header X-Forwarded-Host $http_host;

            # Disable proxy buffering for large streaming downloads
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_max_temp_file_size 0;

            proxy_hide_header X-Powered-By;
        }

        # 5. Block external access to internal cluster endpoints
        location /internal/ {
            default_type application/json;
            return 403 '{"code":"FORBIDDEN","message":"Internal endpoints cannot be accessed from public gateway"}\n';
        }

        # 6. Web Admin Console (Flutter Web SPA)
        location / {
            proxy_pass http://web_backend/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $real_proto;
        }
    }
}
