services:
  ftp_svc:
    build:
      context: ../..
      dockerfile: services/ftp/Dockerfile
    environment:
      SERVICE_NAME: ftp_svc
      HTTP_ADDR: ":8080"
      GRPC_ADDR: ":50052"
      API_SVC_GRPC_ADDR: ${API_SVC_GRPC_ADDR:-api_svc:50051}
      IMG_TOOL_GRPC_ADDR: ${IMG_TOOL_GRPC_ADDR:-img_tool:50053}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-restick}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-resticksecret}
      MINIO_BUCKET: ${MINIO_BUCKET:-restick-assets}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-internal-token}
      JWT_SECRET: ${JWT_SECRET:-change-me-jwt}
      API_KEYS: ${BOOTSTRAP_API_KEY:-dev-api-key}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost}
    networks:
      - restick

networks:
  restick:
    name: restick
