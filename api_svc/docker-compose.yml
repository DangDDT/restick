services:
  api_svc:
    build:
      context: ..
      dockerfile: api_svc/Dockerfile
    environment:
      SERVICE_NAME: api_svc
      HTTP_ADDR: ":8080"
      GRPC_ADDR: ":50051"
      FTP_SVC_GRPC_ADDR: ${FTP_SVC_GRPC_ADDR:-ftp_svc:50052}
      IMG_TOOL_GRPC_ADDR: ${IMG_TOOL_GRPC_ADDR:-img_tool:50053}
      POSTGRES_DSN: ${POSTGRES_DSN:-postgres://restick:restick@postgres:5432/restick?sslmode=disable}
      JWT_SECRET: ${JWT_SECRET:-change-me-jwt}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-internal-token}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8088}
      PUBLIC_FTP_ORIGIN: ${PUBLIC_FTP_ORIGIN:-http://localhost:8081}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@restick.local}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-changeme}
      BOOTSTRAP_API_KEY: ${BOOTSTRAP_API_KEY:-dev-api-key}
    ports:
      - "8080:8080"
      - "50051:50051"
    networks:
      - restick

networks:
  restick:
    name: restick
