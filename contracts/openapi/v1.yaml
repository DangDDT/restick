        "401": { $ref: '#/components/responses/Unauthorized' }

  /v1/objects/{key}:
    get:
      tags: [SDK]
      summary: Immutable committed object
      description: "Only members allowlisted by the committed version of a ready pack. Auth and pack status are checked before Range or conditional handling. `Cache-Control: private, no-cache` with `ETag`."
      security:
        - ApiKeyAuth: []
        - OwnerCookie: []
      parameters:
        - $ref: '#/components/parameters/ObjectKey'
      responses:
        "200":
          description: WebP, pack.json or thumbnail bytes
          content:
            image/webp: { schema: { type: string, format: binary } }
            application/json: { schema: { type: object } }
        "206": { description: Partial content when Range is valid }
        "304": { description: Not modified for a matching If-None-Match }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
        "410": { $ref: '#/components/responses/Gone' }
    head:
      tags: [SDK]
      summary: Object metadata
      security:
        - ApiKeyAuth: []
        - OwnerCookie: []
      parameters:
        - $ref: '#/components/parameters/ObjectKey'
      responses:
        "200": { description: Headers only }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
        "410": { $ref: '#/components/responses/Gone' }

