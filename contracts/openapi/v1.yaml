openapi: 3.1.0
info:
  title: Restick public HTTP
  version: 0.0.1
  description: >
    Browser and Flutter clients use HTTP. Backend services speak gRPC with each other.
    Restick does not generate images from keywords.
paths:
  /healthz:
    get:
      summary: Process liveness
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status, service]
                properties:
                  status:
                    type: string
                  service:
                    type: string
