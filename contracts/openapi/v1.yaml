          description: Queued job
          content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }
        "410": { $ref: '#/components/responses/Gone' }
        "422": { $ref: '#/components/responses/Unprocessable' }

  /api/v1/admin/packs/{id}/revoke:
    post:
      tags: [Admin packs]
      summary: Revoke a pack
      description: Requires a committed version. Idempotent; a second call keeps the single tombstone and timestamp.
      security: [{ OwnerCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/PackID'
      responses:
        "200":
          description: Revoked pack
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminPack' } } }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }
        "422": { $ref: '#/components/responses/Unprocessable' }

  /api/v1/admin/jobs/{id}:
    get:
      tags: [Admin jobs]
      summary: Get a job
      security: [{ OwnerCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/ResourceID'
      responses:
        "200":
          description: Job object
          content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/api-keys:
    get:
      tags: [Admin keys]
      summary: List client keys
      description: Metadata only; hashes and raw values are never returned.
      security: [{ OwnerCookie: [] }]
      responses:
        "200":
          description: Keys newest first
          content: { application/json: { schema: { $ref: '#/components/schemas/KeyList' } } }
        "401": { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Admin keys]
      summary: Create a read-only client key
      description: The raw key is returned exactly once by this response.
      security: [{ OwnerCookie: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateKeyRequest' } } }
      responses:
        "201":
          description: Key with its one-time raw value
          content: { application/json: { schema: { $ref: '#/components/schemas/CreatedKey' } } }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "413": { $ref: '#/components/responses/TooLarge' }
        "422": { $ref: '#/components/responses/Unprocessable' }

  /api/v1/admin/api-keys/{id}/rotate:
    post:
      tags: [Admin keys]
      summary: Rotate a key
      description: Disables the old key and creates a replacement with the same name and expiry in one transaction.
      security: [{ OwnerCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/ResourceID'
      responses:
        "201":
          description: Replacement key with its one-time raw value
          content: { application/json: { schema: { $ref: '#/components/schemas/CreatedKey' } } }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/api-keys/{id}:
    delete:
      tags: [Admin keys]
      summary: Disable a key
      description: Idempotent; the first disable time is preserved.
      security: [{ OwnerCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/ResourceID'
      responses:
        "204": { description: Disabled }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
