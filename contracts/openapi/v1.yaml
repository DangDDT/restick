openapi: 3.1.0
info:
  title: Restick single-operator sticker factory
  version: 0.1.0
  license:
    name: MIT
    identifier: MIT
  description: |
    One-owner HTTP API. Contract for the Flutter SDK and the exported web UI.

    Authentication
    - SDK read routes: `X-Api-Key` (read-only client key) or the owner session
      cookie `__Host-restick_admin`.
    - Admin routes under `/api/v1/admin`: owner session cookie only. A client key
      never authorizes an admin route, even a valid one.
    - Unsafe admin requests (anything but GET/HEAD) must send `Origin` equal to
      the configured public base URL; a missing or foreign Origin is 403.
    - Login limits failed attempts to 5 per 15 minutes per source address.

    Transport limits
    - Admin JSON bodies: 1 MiB, content type `application/json`, single document,
      unknown fields rejected.
    - Multipart uploads: 8 MiB file plus 64 KiB of form overhead.
    - Errors always use `{"error":{"code","message"}}`; internal paths and stack
      traces are never returned.

    Caching
    - JSON metadata is `no-store`.
    - Committed files are `private, no-cache` with `ETag` and Range support.
servers:
  - url: /
    description: This factory instance
tags:
  - name: Health
  - name: Docs
  - name: SDK
  - name: Admin session
  - name: Admin library
  - name: Admin characters
  - name: Admin designs
  - name: Admin packs
  - name: Admin jobs
  - name: Admin keys
security: []
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Read-only client key. Never accepted by admin routes.
    OwnerCookie:
      type: apiKey
      in: cookie
      name: __Host-restick_admin
      description: Opaque owner session set by `POST /api/v1/admin/session`; HttpOnly, Secure, SameSite=Strict, Path=/, 24 h.

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Query:
      name: q
      in: query
      description: Case-insensitive-ish text filter (SQLite LIKE) over the listed fields.
      schema: { type: string }
    PackID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ResourceID:
      name: id
      in: path
      required: true
      schema: { type: string }
    ObjectKey:
      name: key
      in: path
      required: true
      description: Data-root relative committed object path (`packs/<uuid>/v<n>/<member>`). Allowlisted per committed version.
      schema: { type: string }
    Version:
      name: version
      in: path
      required: true
      schema: { type: integer, minimum: 1 }

  responses:
    BadRequest:
      description: Malformed JSON, body or query parameter.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unauthorized:
      description: Missing or invalid credentials.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: Origin missing or not the configured public base URL.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Resource not found or not visible.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: Conflict such as reserved slug, active job or non-empty group.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Gone:
      description: Pack revoked.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    TooLarge:
      description: Body or upload exceeds the documented limit.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unprocessable:
      description: Well-formed request that violates validation rules.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    RateLimited:
      description: Too many failed logins from this source in the window.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Internal:
      description: Unexpected server-side failure.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              examples: [unauthorized, not_found, pack_revoked, job_active, group_not_empty, invalid_content_type, payload_too_large, rate_limited]
            message: { type: string }
      additionalProperties: false

    Health:
      type: object
      required: [status, service]
      properties:
        status: { type: string, enum: [ok, unavailable] }
        service: { type: string, const: restick }

    Timestamp:
      type: string
      description: UTC RFC3339 at second precision.
      examples: ["2026-11-11T09:30:15Z"]

    Colors:
      type: object
      required: [primary, secondary, accent, line]
      properties:
        primary: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        secondary: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        accent: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        line: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
      additionalProperties: false

    Group:
      type: object
      required: [id, name, description, sort_order, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        sort_order: { type: integer }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }

    GroupDraft:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        sort_order: { type: integer }
      additionalProperties: false

    GroupList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Group' }

    Fragment:
      type: object
      required: [id, group_id, name, name_en, prompt, scope, archived, created_at, updated_at]
      properties:
        id: { type: string }
        group_id: { type: string }
        name: { type: string }
        name_en: { type: string }
        prompt: { type: string }
        notes: { type: string }
        source: { type: string }
        scope: { type: string, enum: [identity, pack, sticker] }
        colors: { $ref: '#/components/schemas/Colors' }
        archived: { type: boolean }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }

    FragmentDraft:
      type: object
      required: [group_id, name, prompt, scope]
      properties:
        group_id: { type: string }
        name: { type: string }
        name_en: { type: string }
        prompt: { type: string }
        notes: { type: string }
        source: { type: string }
        scope: { type: string, enum: [identity, pack, sticker] }
        colors: { $ref: '#/components/schemas/Colors' }
      additionalProperties: false

    FragmentPage:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Fragment' }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }

    Character:
      type: object
      required: [id, name, description, identity_notes, rights_notes, archived, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        identity_notes: { type: string }
        rights_notes: { type: string }
        reference_asset_id: { type: string }
        archived: { type: boolean }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }

    CharacterDraft:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        identity_notes: { type: string }
        rights_notes: { type: string }
        reference_asset_id: { type: string }
      additionalProperties: false

    CharacterList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Character' }

    ReferenceAsset:
      type: object
      required: [id, filename, content_type, byte_size, width, height, checksum_sha256, created_at]
      properties:
        id: { type: string }
        filename: { type: string }
        content_type: { type: string, enum: [image/png, image/jpeg, image/webp] }
        byte_size: { type: integer, minimum: 1 }
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
        checksum_sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        created_at: { $ref: '#/components/schemas/Timestamp' }

    Cell:
      type: object
      properties:
        action: { type: string }
        expression: { type: string }
        fragment_ids: { type: array, items: { type: string } }
        free_text: { type: string }
      additionalProperties: false

    Draft:
      type: object
      required: [name, rows, columns, cells]
      properties:
        id: { type: string, description: Ignored on create and on compile/suggest. }
        name: { type: string }
        character_id: { type: string }
        group_ids: { type: array, items: { type: string } }
        fragment_ids: { type: array, items: { type: string } }
        pinned_fragment_ids: { type: array, items: { type: string } }
        palette_id: { type: string }
        free_text: { type: string }
        rows: { type: integer, minimum: 1, maximum: 8 }
        columns: { type: integer, minimum: 1, maximum: 8 }
        cells: { type: array, items: { $ref: '#/components/schemas/Cell' } }
        outline_width:
          type: integer
          minimum: 0
          maximum: 16
          default: 4
          description: Omitted means 4 (`studio.DefaultOutlineWidth`); an explicit 0 means no outline.
        outline_color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$|^$'
          description: Empty means #FFFFFF.
      additionalProperties: false

    Selection:
      type: object
      required: [group_id, group_name, fragment_id, name, prompt, scope]
      properties:
        group_id: { type: string }
        group_name: { type: string }
        fragment_id: { type: string }
        name: { type: string }
        prompt: { type: string }
        scope: { type: string, enum: [identity, pack, sticker] }

    SnapshotCharacter:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        identity_notes: { type: string }

    SnapshotPalette:
      type: object
      properties:
        fragment_id: { type: string }
        name: { type: string }
        prompt: { type: string }
        primary: { type: string }
        secondary: { type: string }
        accent: { type: string }
        line: { type: string }

    SnapshotCell:
      type: object
      required: [row, column]
      properties:
        row: { type: integer }
        column: { type: integer }
        action: { type: string }
        expression: { type: string }
        free_text: { type: string }
        fragments:
          type: array
          items: { $ref: '#/components/schemas/Selection' }

    Snapshot:
      type: object
      required: [schema_version, selections, rows, columns, outline_width, outline_color, cells, compiled_at]
      properties:
        schema_version: { type: integer, const: 1 }
        character: { $ref: '#/components/schemas/SnapshotCharacter' }
        selections:
          type: array
          items: { $ref: '#/components/schemas/Selection' }
        palette: { $ref: '#/components/schemas/SnapshotPalette' }
        free_text: { type: string }
        rows: { type: integer }
        columns: { type: integer }
        outline_width: { type: integer, minimum: 0, maximum: 16 }
        outline_color: { type: string }
        cells:
          type: array
          items: { $ref: '#/components/schemas/SnapshotCell' }
        compiled_at: { $ref: '#/components/schemas/Timestamp' }

    Design:
      type: object
      required: [id, name, rows, columns, outline_width, outline_color, draft, snapshot, compiled_prompt, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        character_id: { type: string }
        rows: { type: integer }
        columns: { type: integer }
        outline_width: { type: integer }
        outline_color: { type: string }
        draft: { $ref: '#/components/schemas/Draft' }
        snapshot: { $ref: '#/components/schemas/Snapshot' }
        compiled_prompt: { type: string }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }

    DesignPage:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Design' }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }

    CompiledDesign:
      type: object
      required: [compiled_prompt, snapshot]
      properties:
        compiled_prompt: { type: string }
        snapshot: { $ref: '#/components/schemas/Snapshot' }

    PackSummary:
      type: object
      required: [id, slug, name, author, tags, sticker_count, version, thumbnail_url, checksum_sha256]
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        author: { type: string }
        tags: { type: array, items: { type: string } }
        sticker_count: { type: integer }
        version: { type: integer }
        thumbnail_url: { type: string }
        checksum_sha256: { type: string }

    PackSticker:
      type: object
      required: [file, emoji_hint, keywords, width, height, file_url, thumb_url]
      properties:
        file: { type: string }
        emoji_hint: { type: string }
        keywords: { type: array, items: { type: string } }
        width: { type: integer }
        height: { type: integer }
        file_url: { type: string }
        thumb_url: { type: string }

    PackDetail:
      allOf:
        - $ref: '#/components/schemas/PackSummary'
        - type: object
          required: [stickers]
          properties:
            stickers:
              type: array
              items: { $ref: '#/components/schemas/PackSticker' }

    PackPage:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PackSummary' }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }

    BundleMeta:
      type: object
      required: [url, checksum_sha256, version]
      properties:
        url: { type: string }
        checksum_sha256: { type: string }
        version: { type: integer }

    Tombstone:
      type: object
      required: [pack_id, revoked_at, reason_code, checksum_sha256]
      properties:
        pack_id: { type: string }
        revoked_at: { $ref: '#/components/schemas/Timestamp' }
        reason_code: { type: string }
        checksum_sha256: { type: string }

    TombstoneList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Tombstone' }

    AdminPackSource:
      type: object
      required: [id, filename, checksum_sha256, width, height, byte_size]
      properties:
        id: { type: string }
        filename: { type: string }
        checksum_sha256: { type: string }
        width: { type: integer }
        height: { type: integer }
        byte_size: { type: integer }

    AdminPackSticker:
      type: object
      required: [sort_order, filename, checksum_sha256, width, height, emoji_hint, keywords, object_url, thumb_url]
      properties:
        sort_order: { type: integer }
        filename: { type: string }
        checksum_sha256: { type: string }
        width: { type: integer }
        height: { type: integer }
        emoji_hint: { type: string }
        keywords: { type: array, items: { type: string } }
        object_url: { type: string }
        thumb_url: { type: string }

    AdminPack:
      type: object
      required: [id, slug, name, author, description, tags, status, current_version, sticker_count, checksum_sha256, thumbnail_url, source, created_at, updated_at]
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        author: { type: string }
        description: { type: string }
        tags: { type: array, items: { type: string } }
        design_id: { type: string }
        status: { type: string, enum: [draft, ready, revoked] }
        current_version: { type: integer }
        sticker_count: { type: integer }
        checksum_sha256: { type: string }
        thumbnail_url: { type: string }
        source:
          oneOf:
            - $ref: '#/components/schemas/AdminPackSource'
            - type: 'null'
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }

    AdminPackDetail:
      allOf:
        - $ref: '#/components/schemas/AdminPack'
        - type: object
          required: [stickers, bundle_url]
          properties:
            stickers:
              type: array
              items: { $ref: '#/components/schemas/AdminPackSticker' }
            bundle_url: { type: string }
            latest_job:
              description: Latest processing attempt by reserved version, including active state or terminal failure diagnostics. Omitted before the first attempt.
              allOf:
                - $ref: '#/components/schemas/Job'

    AdminPackPage:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminPack' }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }

    PackCreate:
      type: object
      required: [slug, name]
      properties:
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
        name: { type: string }
        author: { type: string }
        description: { type: string }
        tags: { type: array, items: { type: string } }
        design_id: { type: string }
      additionalProperties: false

    PackUpdate:
      type: object
      required: [name, author, description, tags]
      properties:
        name: { type: string }
        author: { type: string }
        description: { type: string }
        tags: { type: array, items: { type: string } }
        design_id: { type: string }
      additionalProperties: false

    JobRequest:
      type: object
      required: [schema_version, job_id, pack_id, version, design, source, catalog, rows, columns, outline_width, outline_color]
      properties:
        schema_version: { type: integer, const: 1 }
        job_id: { type: string }
        pack_id: { type: string }
        version: { type: integer }
        design_id: { type: string }
        design: { $ref: '#/components/schemas/Snapshot' }
        source:
          type: object
          properties:
            id: { type: string }
            filename: { type: string }
            checksum_sha256: { type: string }
            width: { type: integer }
            height: { type: integer }
            byte_size: { type: integer }
        catalog:
          type: object
          properties:
            slug: { type: string }
            name: { type: string }
            author: { type: string }
            description: { type: string }
            tags: { type: array, items: { type: string } }
        rows: { type: integer }
        columns: { type: integer }
        outline_width: { type: integer }
        outline_color: { type: string }

    Job:
      type: object
      required: [id, pack_id, version, status, request, result, created_at, started_at, finished_at]
      properties:
        id: { type: string }
        pack_id: { type: string }
        version: { type: integer }
        status: { type: string, enum: [queued, running, succeeded, failed, interrupted] }
        request: { $ref: '#/components/schemas/JobRequest' }
        result:
          description: Publication summary after success (`restick.job-publication.v1`), otherwise null. Processing failures stay job data and are never HTTP errors.
          oneOf:
            - type: object
            - type: 'null'
        error_code:
          type: string
          enum: [timeout, processor_failed, result_invalid, stage_failed, commit_failed, publish_failed, shutdown, startup_recovery, pack_revoked]
        error_message: { type: string }
        diagnostics: { type: string }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        started_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        finished_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'

    LoginRequest:
      type: object
      required: [password]
      properties:
        password: { type: string }
      additionalProperties: false

    SessionInfo:
      type: object
      required: [username]
      properties:
        username: { type: string, const: admin }

    CreatedKey:
      type: object
      required: [id, name, prefix, raw]
      properties:
        id: { type: string }
        name: { type: string }
        prefix: { type: string }
        raw:
          type: string
          description: Returned exactly once by create/rotate.

    Key:
      type: object
      required: [id, name, prefix, active, created_at, expires_at, disabled_at]
      properties:
        id: { type: string }
        name: { type: string }
        prefix: { type: string }
        active: { type: boolean }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        expires_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        disabled_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'

    KeyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Key' }

    CreateKeyRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        expires_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
      additionalProperties: false

paths:
  /healthz:
    get:
      tags: [Health]
      summary: Liveness
      responses:
        "200":
          description: Ready (database reachable and data root writable)
          content: { application/json: { schema: { $ref: '#/components/schemas/Health' } } }
        "503":
          description: Not ready; no private diagnostics are returned
          content: { application/json: { schema: { $ref: '#/components/schemas/Health' } } }

  /openapi.yaml:
    get:
      tags: [Docs]
      summary: Canonical OpenAPI document (runtime copy)
      responses:
        "200":
          description: YAML document
          content: { application/yaml: { schema: { type: string } } }
        "500":
          $ref: '#/components/responses/Internal'

  /docs:
    get:
      tags: [Docs]
      summary: Swagger UI shell pointing at /openapi.yaml
      responses:
        "200":
          description: HTML
          content: { text/html: { schema: { type: string } } }

  /api/v1/packs:
    get:
      tags: [SDK]
      summary: List ready packs
      description: Ready packs only, ordered by updated_at DESC then id. Draft and revoked packs are never listed.
      security:
        - ApiKeyAuth: []
        - OwnerCookie: []
      parameters:
        - name: tag
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        "200":
          description: One page
          content: { application/json: { schema: { $ref: '#/components/schemas/PackPage' } } }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "500": { $ref: '#/components/responses/Internal' }

  /api/v1/packs/{id}:
    get:
      tags: [SDK]
      summary: Ready pack summary with stickers
      security:
        - ApiKeyAuth: []
        - OwnerCookie: []
      parameters:
        - $ref: '#/components/parameters/PackID'
      responses:
        "200":
          description: Summary plus sticker list and ETag
          content: { application/json: { schema: { $ref: '#/components/schemas/PackDetail' } } }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
        "410": { $ref: '#/components/responses/Gone' }
    head:
      tags: [SDK]
      summary: Visibility and checksum ETag without a body
      security:
        - ApiKeyAuth: []
        - OwnerCookie: []
      parameters:
        - $ref: '#/components/parameters/PackID'
      responses:
        "200": { description: "Same visibility as GET, empty body" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
        "410": { $ref: '#/components/responses/Gone' }

