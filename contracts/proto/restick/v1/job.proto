syntax = "proto3";

package restick.v1;

option go_package = "github.com/eykh/restick/contracts/gen/go/restick/v1;restickv1";

service JobService {
  rpc ClaimJob(ClaimJobRequest) returns (ClaimJobResponse);
  rpc CompleteJob(CompleteJobRequest) returns (CompleteJobResponse);
  rpc FailJob(FailJobRequest) returns (FailJobResponse);
  rpc UpsertCLIPack(UpsertCLIPackRequest) returns (UpsertCLIPackResponse);
}

message ClaimJobRequest {}

message ClaimJobResponse {
  bool empty = 1;
  string job_id = 2;
  string pack_id = 3;
  string source_kind = 4;
  string source_prefix = 5;
  string name = 6;
  string slug = 7;
  string author = 8;
  repeated string tags = 9;
}

message StickerMeta {
  string file = 1;
  string thumb = 2;
  string emoji_hint = 3;
  int32 width = 4;
  int32 height = 5;
  string object_key = 6;
  string thumb_key = 7;
}

message CompleteJobRequest {
  string job_id = 1;
  string checksum_sha256 = 2;
  string thumbnail_key = 3;
  string bundle_key = 4;
  int32 version = 5;
  repeated StickerMeta stickers = 6;
}

message CompleteJobResponse {}

message FailJobRequest {
  string job_id = 1;
  string error = 2;
}

message FailJobResponse {}

message UpsertCLIPackRequest {
  string pack_id = 1;
  string slug = 2;
  string name = 3;
  string author = 4;
  repeated string tags = 5;
  string checksum_sha256 = 6;
  string thumbnail_key = 7;
  string bundle_key = 8;
  int32 version = 9;
  repeated StickerMeta stickers = 10;
}

message UpsertCLIPackResponse {}
