syntax = "proto3";

package restick.v1;

option go_package = "github.com/eykh/restick/contracts/gen/go/restick/v1;restickv1";

service AuthService {
  rpc ValidateAPIKey(ValidateAPIKeyRequest) returns (ValidateAPIKeyResponse);
}

message ValidateAPIKeyRequest {
  string api_key = 1;
}

message ValidateAPIKeyResponse {
  bool valid = 1;
  string user_id = 2;
  string key_id = 3;
  string name = 4;
}
