[project]
name = "img-tool"
version = "0.0.1"
description = "Restick image pipeline. Does not generate images from keywords."
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "grpcio>=1.68",
    "protobuf>=5",
    "pillow>=10",
    "numpy>=2",
    "opencv-python-headless>=4.10",
]

[project.scripts]
img_tool = "img_tool.interfaces.cli:app"

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
