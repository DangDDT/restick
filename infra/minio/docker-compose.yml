services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-restick}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-resticksecret}
    volumes:
      - restick_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - restick
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
        restart: true
    restart: "no"
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-restick}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-resticksecret}
      MINIO_BUCKET: ${MINIO_BUCKET:-restick-assets}
    entrypoint:
      - /bin/sh
      - -c
      - |
        i=0
        until mc alias set local http://minio:9000 $$MINIO_ACCESS_KEY $$MINIO_SECRET_KEY; do
          i=$$((i+1))
          if [ "$$i" -gt 30 ]; then exit 1; fi
          sleep 1
        done
        mc mb --ignore-existing local/$$MINIO_BUCKET
        mc stat local/$$MINIO_BUCKET >/dev/null
    networks:
      - restick

volumes:
  restick_minio:

networks:
  restick:
    name: restick
