name: CI — Backend & Infra

on:
  push:
    branches: [main]
    paths:
      - 'services/**'
      - 'infra/**'
      - 'clients/web-next/**'
      - 'docker-compose.yml'
      - 'docker-compose.override.yml'
      - '.env.example'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'services/**'
      - 'infra/**'
      - 'clients/web-next/**'
      - 'docker-compose.yml'
      - 'docker-compose.override.yml'
      - '.env.example'
      - '.github/workflows/ci-backend.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------
  # 1. Docker Compose & Ingress Architecture Validation
  # -------------------------------------------------------------
  compose-validation:
    name: Compose Config Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose Configuration
        run: |
          docker compose config --quiet
          echo "Docker compose configuration is valid!"

  # -------------------------------------------------------------
  # 2. Go Backend Services (api, ftp)
  # -------------------------------------------------------------
  go-services:
    name: Go Services (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [services/api, services/ftp]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: ${{ matrix.service }}/go.sum
      - name: Vet & Test
        working-directory: ${{ matrix.service }}
        run: |
          go vet ./...
          go test -v -race ./...

  # -------------------------------------------------------------
  # 3. Python Image Processing Worker (img_tool)
  # -------------------------------------------------------------
  python-worker:
    name: Python Worker (img_tool)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/img_tool/pyproject.toml
      - name: Install dependencies & linter
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          pip install -e services/img_tool
      - name: Ruff Lint
        run: ruff check services/img_tool
      - name: Verify CLI Entrypoint
        run: img_tool --help

  # -------------------------------------------------------------
  # 4. Next.js Web Admin Console (clients/web-next)
  # -------------------------------------------------------------
  web-next:
    name: Next.js Web Admin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: clients/web-next/package-lock.json
      - name: Install Dependencies
        working-directory: clients/web-next
        run: npm ci
      - name: Lint
        working-directory: clients/web-next
        run: npm run lint
      - name: Build Static Export
        working-directory: clients/web-next
        run: npm run build
