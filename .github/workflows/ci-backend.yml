name: CI — Restick Application

on:
  push:
    branches: [main]
    paths:
      - 'services/**'
      - 'clients/web-next/**'
      - 'contracts/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.dockerignore'
      - '.env.example'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'services/**'
      - 'clients/web-next/**'
      - 'contracts/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.dockerignore'
      - '.env.example'
      - '.github/workflows/ci-backend.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-validation:
    name: Compose Config Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the single-service compose file
        run: |
          bootstrap="$RUNNER_TEMP/bootstrap"
          mkdir -p "$bootstrap"
          RESTICK_PUBLIC_BASE_URL=https://ci.example \
          RESTICK_BOOTSTRAP_DIR="$bootstrap" \
            docker compose config --quiet

  go-api:
    name: Go API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # cmd/restick tests serve the real exported studio, so the static build
      # is a prerequisite of this isolated job.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: clients/web-next/package-lock.json
      - name: Build Static Studio Export
        working-directory: clients/web-next
        run: |
          npm ci
          npm run build
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: services/api/go.sum
      # internal/integration runs the real Python machine job through the fixed
      # `python` argv, so this job installs the actual processor rather than
      # skipping the round trip.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/media_factory/pyproject.toml
      - name: Install image processor
        run: |
          python -m pip install --upgrade pip
          pip install -e services/media_factory
      - name: Vet & Test
        working-directory: services/api
        run: |
          go vet ./...
          go test -race ./...

  python-core:
    name: Python Core & Local CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/media_factory/pyproject.toml
      - name: Install dependencies & linter
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          pip install -e services/media_factory
      - name: Ruff Lint
        run: ruff check services/media_factory
      - name: Unit Tests
        working-directory: services/media_factory
        run: python -m unittest discover -s tests -v
      - name: Verify Local CLI & Machine Job
        run: |
          media_factory --help
          python -m media_factory.interfaces.machine_job --help

  web-static:
    name: Static Studio Export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: clients/web-next/package-lock.json
      - name: Install Dependencies
        working-directory: clients/web-next
        run: npm ci
      - name: Lint
        working-directory: clients/web-next
        run: npm run lint
      - name: Build Static Export
        working-directory: clients/web-next
        run: npm run build

  image:
    name: Build Root Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Application Image
        run: docker build --tag restick:ci .
