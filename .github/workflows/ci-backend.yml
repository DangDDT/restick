name: CI — Restick Application

on:
  push:
    branches: [main]
    paths:
      - 'services/**'
      - 'clients/web-next/**'
      - 'contracts/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.dockerignore'
      - '.env.example'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'services/**'
      - 'clients/web-next/**'
      - 'contracts/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.dockerignore'
      - '.env.example'
      - '.github/workflows/ci-backend.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-validation:
    name: Compose Config Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the single-service compose file
        run: |
          secret="$RUNNER_TEMP/admin_password"
          mkdir -p "$(dirname "$secret")"
          printf 'ci-only-password\n' > "$secret"
          RESTICK_PUBLIC_BASE_URL=https://ci.example \
          RESTICK_ADMIN_PASSWORD_SECRET="$secret" \
            docker compose config --quiet

  go-api:
    name: Go API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: services/api/go.sum
      - name: Vet & Test
        working-directory: services/api
        run: |
          go vet ./...
          go test -race ./...

  python-core:
    name: Python Core & Local CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/img_tool/pyproject.toml
      - name: Install dependencies & linter
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          pip install -e services/img_tool
      - name: Ruff Lint
        run: ruff check services/img_tool
      - name: Unit Tests
        working-directory: services/img_tool
        run: python -m unittest discover -s tests -v
      - name: Verify Local CLI & Machine Job
        run: |
          img_tool --help
          python -m img_tool.interfaces.machine_job --help

  web-static:
    name: Static Studio Export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: clients/web-next/package-lock.json
      - name: Install Dependencies
        working-directory: clients/web-next
        run: npm ci
      - name: Lint
        working-directory: clients/web-next
        run: npm run lint
      - name: Build Static Export
        working-directory: clients/web-next
        run: npm run build

  image:
    name: Build Root Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Application Image
        run: docker build --tag restick:ci .
