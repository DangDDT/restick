name: Publish Flutter SDK to OnePub

# Trigger convention:
#   sdk/v0.2.0              → publishes from main   (Flutter stable / 3.47+)
#   sdk/v0.2.0-flutter3.32  → publishes from support/flutter-3.32
#
# Run manually via workflow_dispatch when needed.
on:
  push:
    tags:
      - 'sdk/v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

jobs:
  publish:
    name: Publish Flutter SDK to OnePub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install SDK Dependencies
        working-directory: clients/flutter/restick
        run: flutter pub get

      - name: Generate SDK Code
        working-directory: clients/flutter/restick
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Run Tests & Static Analysis
        working-directory: clients/flutter/restick
        run: |
          flutter analyze
          flutter test

      - name: Install OnePub CLI
        run: dart pub global activate onepub

      - name: Authenticate with OnePub
        env:
          ONEPUB_TOKEN: ${{ secrets.ONEPUB_TOKEN }}
        run: |
          if [ -z "$ONEPUB_TOKEN" ]; then
            echo "::error::ONEPUB_TOKEN secret is not set."
            exit 1
          fi
          onepub import-token "$ONEPUB_TOKEN"

      - name: Publish Package to OnePub
        working-directory: clients/flutter/restick
        run: dart pub publish --force
