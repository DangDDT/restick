name: Build & Publish Restick Image

# Publishes the single application image with an immutable commit tag.
# Deployment is an operator action: pull this tag (or its digest) on the VPS and
# recreate the one compose service. This workflow never SSHes or deploys.

on:
  push:
    branches: [main]
    paths:
      - 'services/**'
      - 'clients/web-next/**'
      - 'contracts/openapi/v1.yaml'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.dockerignore'
      - '.github/workflows/deploy-app.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and Publish to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lowercase Repository Owner
        id: repo_owner
        run: echo "owner=${OWNER,,}" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Login to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Immutable Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ steps.repo_owner.outputs.owner }}/restick:${{ github.sha }}
