name: restick_web
description: Restick contributor and admin web UI. Does not generate images from keywords.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.7.0 <4.0.0"
  flutter: ">=3.29.0"

dependencies:
  auto_size_text: ^3.0.0
  dio: ^5.11.0
  drift: ^2.28.2
  equatable: ^2.1.0
  file_picker: ^11.0.3
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^10.3.1
  get_it: ^9.2.1
  go_router: ^17.0.0
  google_fonts: ^6.3.2
  intl: ^0.20.2
  json_annotation: ^4.9.0
  material_ui: ^1.0.1
  path: ^1.9.1
  responsive_framework: ^1.5.1
  retrofit: ^4.9.0
  shared_preferences: ^2.5.3
  sqlite3: ^2.9.4
  web: ^1.1.1

dev_dependencies:
  bloc_lint: ^0.3.7
  build_runner: ^2.15.1
  custom_lint: ^0.8.1
  drift_dev: ^2.31.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  json_serializable: ^6.11.2
  retrofit_generator: ^10.2.1
  very_good_analysis: ^9.0.0

flutter:
  uses-material-design: true
  generate: true
