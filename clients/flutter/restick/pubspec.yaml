name: restick
description: Flutter sticker SDK for Restick. Marketplace and local gallery. Does not generate images.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  archive: ^3.6.1
  auto_size_text: ^3.0.0
  crypto: ^3.0.6
  dio: ^5.11.0
  drift: ^2.28.2
  equatable: ^2.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_secure_storage: ^10.3.1
  material_ui: ^1.0.1
  path: ^1.9.1
  path_provider: ^2.1.5
  retrofit: ^4.9.0
  shared_preferences: ^2.5.3
  sqlite3: ^2.9.4
  sqlite3_flutter_libs: ^0.5.39

dev_dependencies:
  bloc_lint: ^0.3.7
  build_runner: ^2.15.1
  custom_lint: ^0.8.1
  drift_dev: ^2.31.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  retrofit_generator: ^10.2.1
  very_good_analysis: ^9.0.0

flutter:
  uses-material-design: true
