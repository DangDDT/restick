name: restick
description: Official Flutter SDK for the Restick sticker ecosystem. High-performance streaming, offline caching, and marketplace widgets.
version: 0.1.0
publish_to: "https://onepub.dev/api/xdhdsdavuh"
repository: https://github.com/DangDDT/restick
issue_tracker: https://github.com/DangDDT/restick/issues
homepage: https://github.com/DangDDT/restick
topics:
  - stickers
  - chat
  - sdk
  - flutter

environment:
  sdk: ">=3.7.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  archive: ">=3.6.1 <5.0.0"
  auto_size_text: ">=3.0.0 <4.0.0"
  crypto: ">=3.0.0 <4.0.0"
  dio: ">=5.0.0 <6.0.0"
  drift: ">=2.15.0 <3.0.0"
  equatable: ">=2.0.0 <3.0.0"
  flutter:
    sdk: flutter
  flutter_bloc: ">=8.0.0 <10.0.0"
  flutter_secure_storage: ">=9.0.0 <12.0.0"
  material_ui: ">=1.11.0 <2.0.0"
  path: ">=1.8.0 <2.0.0"
  path_provider: ">=2.0.0 <3.0.0"
  shared_preferences: ">=2.0.0 <3.0.0"
  sqlite3: ">=2.0.0 <4.0.0"

dev_dependencies:
  bloc_lint: ^0.3.7
  build_runner: ^2.15.1
  custom_lint: ^0.8.1
  drift_dev: ^2.31.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  very_good_analysis: ^9.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL.txt
  fonts:
    - family: Baloo2
      fonts:
        - asset: assets/fonts/Baloo2-500.ttf
          weight: 500
        - asset: assets/fonts/Baloo2-600.ttf
          weight: 600
        - asset: assets/fonts/Baloo2-700.ttf
          weight: 700
        - asset: assets/fonts/Baloo2-800.ttf
          weight: 800
