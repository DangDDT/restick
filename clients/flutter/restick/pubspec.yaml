name: restick
description: Official Flutter SDK for the Restick sticker ecosystem. High-performance streaming, offline caching, and marketplace widgets.
version: 0.1.3-flutter3.32.8
publish_to: "https://onepub.dev/api/xdhdsdavuh"
repository: https://github.com/DangDDT/restick
issue_tracker: https://github.com/DangDDT/restick/issues
homepage: https://github.com/DangDDT/restick
topics:
  - stickers
  - chat
  - sdk
  - flutter


environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.32.0 <3.47.0"

dependencies:
  archive: ">=3.6.1 <5.0.0"
  auto_size_text: ">=3.0.0 <4.0.0"
  crypto: ">=3.0.0 <4.0.0"
  dio: ">=5.0.0 <6.0.0"
  drift: ">=2.15.0 <3.0.0"
  equatable: ">=2.0.0 <3.0.0"
  flutter:
    sdk: flutter
  flutter_bloc: ">=8.0.0 <10.0.0"
  flutter_secure_storage: ">=9.0.0 <12.0.0"
  path: ">=1.8.0 <2.0.0"
  path_provider: ">=2.0.0 <3.0.0"
  retrofit: ">=4.0.0 <5.0.0"
  shared_preferences: ">=2.0.0 <3.0.0"
  sqlite3: ">=2.0.0 <4.0.0"

dev_dependencies:
  bloc_lint: ^0.3.7
  build_runner: ^2.15.1
  custom_lint: ^0.8.1
  drift_dev: ^2.31.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  retrofit_generator: ^10.2.1
  very_good_analysis: ^9.0.0

flutter:
  uses-material-design: true
