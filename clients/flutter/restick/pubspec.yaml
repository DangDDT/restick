name: restick
description: Official Flutter SDK for the Restick sticker ecosystem. High-performance streaming, offline caching, and marketplace widgets.
version: 0.1.0
publish_to: "https://onepub.dev/api/xdhdsdavuh"
repository: https://github.com/DangDDT/restick
issue_tracker: https://github.com/DangDDT/restick/issues
homepage: https://github.com/DangDDT/restick
topics:
  - stickers
  - chat
  - sdk
  - flutter

environment:
  sdk: ">=3.7.0 <4.0.0"
  flutter: ">=3.29.0"

dependencies:
  archive: ^3.6.1
  auto_size_text: ^3.0.0
  crypto: ^3.0.6
  dio: ^5.11.0
  drift: ^2.28.2
  equatable: ^2.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_secure_storage: ^10.3.1
  path: ^1.9.1
  path_provider: ^2.1.5
  retrofit: ^4.9.0
  shared_preferences: ^2.5.3
  sqlite3: ^2.9.4
  sqlite3_flutter_libs: ^0.5.39

dev_dependencies:
  bloc_lint: ^0.3.7
  build_runner: ^2.15.1
  custom_lint: ^0.8.1
  drift_dev: ^2.31.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  retrofit_generator: ^10.2.1
  very_good_analysis: ^9.0.0

flutter:
  uses-material-design: true
