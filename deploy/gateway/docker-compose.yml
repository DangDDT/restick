services:
  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api_svc:
        condition: service_healthy
      ftp_svc:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:80/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - restick

networks:
  restick:
    name: restick
